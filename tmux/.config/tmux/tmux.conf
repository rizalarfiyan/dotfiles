# tmux.conf — modern, XDG-compliant tmux config.
#
# Path:    ~/.config/tmux/tmux.conf  (XDG — no ~/.tmux.conf needed)
# Prefix:  C-a   (Ctrl + a) — never conflicts with C-b in vim/readline

# ---------------------------------------------------------------------------
# Base settings
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g escape-time 10
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g display-panes-time 1000
set -g display-time 2000
set -g history-limit 20000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g status-interval 2
set -g status-left-length 40
set -g status-right-length 80

# ---------------------------------------------------------------------------
# Bindings
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Splits — sensible defaults without prefix for splits (focus-aware)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Smart pane switching with vim-style C-h/j/k/l (inside nested w/ prefix?)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift+arrows (inside/outside prefix)
bind -n M-Left  resize-pane -L 2
bind -n M-Right resize-pane -R 2
bind -n M-Up    resize-pane -U 2
bind -n M-Down  resize-pane -D 2

# Zoom
bind z resize-pane -Z

# Windows
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Sessions
bind d detach-client
bind a command-prompt -p "attach session: " "switch-client -t '%%'"

# Kill without confirm? No — safety first:
bind k confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind K confirm-before -p "kill-window #W? (y/n)" kill-window

# Copy mode — vim keys (must be set BEFORE binding copy-mode-vi table)
set -g mode-keys vi

# Clipboard: prefer wl-copy (Wayland), fall back to xclip (X11), then tmux buffer
if-shell "command -v wl-copy" 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'
if-shell "! command -v wl-copy && command -v xclip" 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"'
if-shell "! command -v wl-copy && ! command -v xclip" 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux load-buffer -"'

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=#1e1e1e,fg=#d4d4d4"

set -g status-left "#[bg=#af87ff,fg=#000000] #S #[default]"
set -g status-left-length 30

set -g status-right "#[fg=#87afaf]#(cut -d' ' -f1-3 /proc/loadavg) | #[fg=#d7ff5f]#(date +'%H:%M') #[fg=#87afaf]#(date +'%a %d %b')"

set -g window-status-current-style "bg=#d7ff5f,fg=#1e1e1e,bold"
set -g window-status-current-format " #I:#W "

set -g window-status-style "bg=#3a3a3a,fg=#a0a0a0"
set -g window-status-format " #I:#W "

set -g pane-border-style "fg=#4a4a4a"
set -g pane-active-border-style "fg=#d7ff5f"

# ---------------------------------------------------------------------------
# Misc UX
# ---------------------------------------------------------------------------
set -g display-panes-colour "#d7ff5f"
set -g display-panes-active-colour "#ff5f87"
set -g message-style "bg=#af87ff,fg=#000000"
set -g message-command-style "bg=#af87ff,fg=#000000"