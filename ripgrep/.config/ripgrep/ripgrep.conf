# ripgrep.conf — default flags for every `rg` invocation.
#
# Referenced by $RIPGREP_CONFIG_PATH (set in env.zsh).
# Flags here apply globally; per-call flags override them.

# Show line numbers (default) & colorize output
--line-number

# Respect .gitignore (default) but also search hidden files
--hidden

# Ignore common non-source dirs even if not gitignored
--glob '!.git/'
--glob '!node_modules/'
--glob '!vendor/'
--glob '!target/'

# Pretty output: column numbers, color on tty only
--column
--colors 'match:fg:green'
--colors 'path:fg:cyan'
--colors 'line:fg:yellow'